<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a0f">
  <title>desk-companion</title>
  <link rel="manifest" href="/web/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/web/icon.png">
  <link rel="stylesheet" href="/web/style.css">
</head>
<body>
  <main id="app" class="landscape">
    <section class="stage">
      <div id="bubble" class="bubble"></div>
      <svg id="mascot" viewBox="-16 -28 32 32" role="img" aria-label="Clawd"></svg>
    </section>
    <section class="data">
      <div id="limits" class="limits"></div>
      <div id="limitsNote" class="note"></div>
      <div id="sessions" class="sessions"></div>
    </section>
    <section id="attnCard" class="attn-card"><div id="attnTitle" class="attn-title"></div><div id="attnMeta" class="attn-meta"></div><button id="attnClose" class="attn-close" hidden>Close</button></section>
    <nav class="controls">
      <button id="btnClose" aria-label="Close">✕</button>
    </nav>
    <aside class="rail">
      <button id="btnRotate" class="rail-btn" aria-label="Rotate">⟲</button>
      <div id="bright" class="bright" role="slider" tabindex="0" aria-label="Brightness" aria-valuemin="10" aria-valuemax="100" aria-valuenow="100"><i class="bright-fill"></i><b class="bright-knob"></b></div>
      <div id="brightPct" class="bright-pct">100%</div>
    </aside>
    <div id="saver" hidden><div class="saver-field"><div class="saver-card"><div id="saverLimits" class="saver-limits"></div></div></div></div>
    <div id="offline" class="overlay" hidden><p>PC offline — waiting…</p></div>
    <div id="dimmer"></div>
    <div id="blank" class="overlay blank" hidden></div>
  </main>
  <script src="/web/vendor/NoSleep.min.js"></script>
  <script type="module" src="/web/app.js"></script>
</body>
</html>
